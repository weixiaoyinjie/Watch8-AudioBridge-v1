name: Build Watch8 AudioBridge OneUpload
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract the single uploaded ZIP
        run: |
          test -f Watch8_AudioBridge_v1_OneUpload.zip
          unzip -q -o Watch8_AudioBridge_v1_OneUpload.zip -d .
          test -f settings.gradle
          test -d wear
          test -d mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner's preinstalled Android SDK (avoid setup-android download failure)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            echo 'Installing missing SDK packages...'
            (yes | "$SDKMANAGER" --licenses >/dev/null) || true
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -d "$SDK/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build watch + phone with the same debug signing key
        run: gradle :wear:assembleDebug :mobile:assembleDebug --no-daemon --stacktrace
      - name: Prepare two APKs
        run: |
          mkdir -p release
          cp wear/build/outputs/apk/debug/wear-debug.apk release/Watch8_AudioBridge_WEAR.apk
          cp mobile/build/outputs/apk/debug/mobile-debug.apk release/Watch8_AudioBridge_PHONE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Watch8-AudioBridge-Two-APKs
          path: release/*.apk
          if-no-files-found: error
